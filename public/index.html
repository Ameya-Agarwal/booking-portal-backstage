<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Main Audi Bookings Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: a stage manager's cue sheet. Stencil-style headings, mono for times and cue codes,
     and two group colours that carry meaning: magenta = lights, teal = sound. */
  --paper:#E9EDF0; --surface:#F7F9FA; --ink:#12161C; --muted:#586471; --line:#C9D1D8; --soft:#DCE2E7;
  --lights:#A8307F; --sound:#0A7A76; --on-c:#FFFFFF;
  --pending:#8A5600; --pending-bg:#F6E7C8; --ok:#1D6F38; --ok-bg:#D3EBDB; --bad:#A8271F; --bad-bg:#F6D9D6;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1217; --surface:#161B22; --ink:#E7ECF1; --muted:#93A0AD; --line:#2A323C; --soft:#222A33;
    --lights:#E873C4; --sound:#3FC8C1; --on-c:#0E1217;
    --pending:#E8B04F; --pending-bg:#3A2D12; --ok:#6AD18C; --ok-bg:#14301F; --bad:#FF9188; --bad-bg:#3C1815;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1217; --surface:#161B22; --ink:#E7ECF1; --muted:#93A0AD; --line:#2A323C; --soft:#222A33;
  --lights:#E873C4; --sound:#3FC8C1; --on-c:#0E1217;
  --pending:#E8B04F; --pending-bg:#3A2D12; --ok:#6AD18C; --ok-bg:#14301F; --bad:#FF9188; --bad-bg:#3C1815;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.5;
  padding-block:20px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
#app{max-width:1060px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;margin:0;text-wrap:balance;font-weight:800}
h1{font-size:clamp(34px,6vw,52px);line-height:.95}
h2{font-size:26px;line-height:1}
h3{font-size:19px;line-height:1.1}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.small{font-size:13px}

/* header + nav */
.top{display:flex;flex-direction:column;gap:6px;padding-bottom:14px}
.top p{max-width:60ch;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:2px solid var(--ink);margin-bottom:22px}
nav.tabs button{
  appearance:none;background:none;border:0;color:var(--muted);cursor:pointer;
  font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;
  padding:8px 14px 7px;white-space:nowrap;border-radius:0;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.badge{font-family:var(--f-mono);font-size:12px;background:var(--bad);color:var(--paper);padding:1px 6px;margin-left:6px;vertical-align:2px}
:focus-visible{outline:3px solid var(--sound);outline-offset:2px}

/* panels + forms */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel>header{display:flex;flex-direction:column;gap:4px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],select{
  font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-bottom:2px solid var(--ink);
  padding:8px 10px;min-width:0;width:100%;border-radius:0;
}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:13px;color:var(--muted)}
.btn{
  appearance:none;font:inherit;font-weight:600;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--paper);
  padding:9px 16px;border-radius:0;
}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--soft);filter:none}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.flash{padding:10px 14px;margin-bottom:18px;border-left:5px solid var(--ink);background:var(--soft)}
.flash.ok{border-color:var(--ok);background:var(--ok-bg)}
.flash.err{border-color:var(--bad);background:var(--bad-bg)}
.flash.info{border-color:var(--pending);background:var(--pending-bg)}

/* resource picker */
fieldset.grp{border:0;border-top:4px solid var(--c);margin:0;padding:8px 0 0;min-width:0}
fieldset.grp legend{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.04em;padding:0 8px 0 0;color:var(--c)}
.g-lights{--c:var(--lights)} .g-sound{--c:var(--sound)}
label.res{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px;margin-top:8px;border:1px solid var(--line);background:var(--paper);cursor:pointer}
label.res:has(input:checked){border-color:var(--c);box-shadow:inset 4px 0 0 var(--c)}
label.res input{width:22px;height:22px;accent-color:var(--c);margin:0}
label.res .nm{font-weight:500;min-width:0;overflow-wrap:anywhere}
label.res .av{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
label.res .av.low{color:var(--pending)} label.res .av.none,label.res .av.over{color:var(--bad)}
label.res.disabled{opacity:.55;cursor:not-allowed}
.tag{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--line);padding:0 5px;margin-left:8px;color:var(--muted)}
.qty{grid-column:2 / 4;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.qty select{width:auto;padding:3px 8px}

/* hour chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  appearance:none;font-family:var(--f-mono);font-size:14px;cursor:pointer;border:1px solid var(--ink);background:var(--paper);color:var(--ink);
  padding:6px 10px;min-width:74px;text-align:left;border-radius:0;display:flex;flex-direction:column;gap:0;line-height:1.25;
}
.chip small{font-size:11px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] small{color:var(--paper);opacity:.8}

/* status */
.pill{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;display:inline-block;white-space:nowrap}
.pill.pending{background:var(--pending-bg);color:var(--pending)}
.pill.approved{background:var(--ok-bg);color:var(--ok)}
.pill.rejected,.pill.cancelled{background:var(--bad-bg);color:var(--bad)}
.cue{font-family:var(--f-mono);font-size:12px;border:1px solid var(--ink);padding:0 6px;letter-spacing:.06em}

/* booking cards */
.list{display:flex;flex-direction:column;gap:12px}
.bk{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--ink);padding:14px 16px;display:grid;gap:8px;min-width:0}
.bk.practice{border-left-style:dashed}
.bk .hd{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bk .ttl{font-weight:600;overflow-wrap:anywhere}
.bk .when{font-family:var(--f-mono);font-size:13px}
.bk .items{font-size:14px;color:var(--muted)}
.bk .warn{font-size:13px;color:var(--bad)}
.empty{border:2px dashed var(--line);padding:26px 18px;color:var(--muted);text-align:center}
.empty b{display:block;font-family:var(--f-display);font-size:22px;text-transform:uppercase;color:var(--ink);margin-bottom:4px}

/* schedule timeline */
.daybar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.daybar input{width:auto}
.daybar .dl{font-family:var(--f-display);font-size:26px;font-weight:800;text-transform:uppercase;margin-right:auto}
.tlwrap{overflow-x:auto;border:1px solid var(--line);background:var(--surface);margin-bottom:22px}
.tl{min-width:880px}
.tl .r{display:grid;grid-template-columns:168px 1fr}
.tl .lab{position:sticky;left:0;z-index:2;background:var(--surface);padding:6px 10px;font-size:13px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;min-width:0}
.tl .lab span{overflow-wrap:anywhere}
.tl .gh .lab{font-family:var(--f-display);font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.05em;color:var(--c);border-bottom:2px solid var(--c)}
.tl .gh .trk{border-bottom:2px solid var(--c)}
.tl .hrs{display:grid;grid-template-columns:repeat(var(--n),1fr);font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.tl .hrs span{padding:6px 0 6px 4px;border-left:1px solid var(--line)}
.tl .trk{position:relative;border-bottom:1px solid var(--line);background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:calc(100% / var(--n)) 100%}
.bar{
  position:absolute;height:22px;font-size:11.5px;font-family:var(--f-mono);line-height:22px;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  background:var(--c);color:var(--on-c);border:1px solid var(--c);
}
.bar.pending{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 30%,var(--surface)) 0 6px,var(--surface) 6px 12px);color:var(--ink);border-style:dashed}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:-10px 0 20px}
.legend i{display:inline-block;width:22px;height:12px;vertical-align:-1px;margin-right:6px;background:var(--ink);border:1px solid var(--ink)}
.legend i.p{background:repeating-linear-gradient(135deg,var(--muted) 0 3px,transparent 3px 6px);border-style:dashed}

/* desk */
.sub{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.sub button{appearance:none;font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:5px 12px;border-radius:0}
.sub button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-family:var(--f-mono);font-weight:400;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:2px solid var(--ink)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl input[type=number]{width:76px;padding:4px 6px}
.tblwrap{overflow-x:auto}
.pp{display:grid;gap:6px;min-width:190px}
.pp label{display:grid;grid-template-columns:3.6rem 1fr;gap:8px;align-items:center;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pp input{width:100%}
.people{display:flex;flex-direction:column;gap:6px}
.person{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.userbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:14px;margin-bottom:14px}
.userbar b{font-weight:600}
.userbar .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.userbar input{width:190px;padding:5px 8px}
.login{max-width:460px}
#gbtn{min-height:44px}
</style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
